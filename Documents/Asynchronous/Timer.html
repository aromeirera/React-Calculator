<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Implement a timeout for an asynchronous fetch request. If the request 
    takes longer than 3 milliseconds, it should be aborted. -->
    <!-- https://restcountries.eu/rest/v2/all -->
     <script>
        function search(url) {
            let controller= new AbortController();
            setTimeout(() => {    
                controller.abort ()
            }, 3)
            fetch(url,{
                    signal: controller.signal})
            .then(Response=Response.json())
            .then(data => console.log(data))
            .catch(error=>console.error(error)
            )
        }
        search("https://restcountries.eu/rest/v2/all")
     </script>
</body>
</html>
